[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--reuse-db -m \"not live\""
markers = [
    "live: talks to the real internet (stable public targets); run with `pytest -m live tests/live`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "I001"]  # auto-generated by Django, never hand-edited
"providers/catalog.py" = ["E501"]  # a table of one provider per line reads better unwrapped

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/migrations/"
