services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rootpulse
      POSTGRES_USER: rootpulse
      POSTGRES_PASSWORD: rootpulse
    ports:
      - "5432:5432"
    volumes:
      - rootpulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rootpulse_db_data:
