name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "43 4 * * *" # nightly: new advisories, and the live tests against the real internet

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the Docker image runs; 3.14 is what development uses.
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootpulse
          POSTGRES_USER: rootpulse
          POSTGRES_PASSWORD: rootpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rootpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DB_NAME: rootpulse
      DB_USER: rootpulse
      DB_PASSWORD: rootpulse
      DB_HOST: localhost
      DB_PORT: 5432
      TEST_DATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # Everything, with branch coverage. The threshold is a floor that catches a forgotten file,
      # not a target: the report is read for gaps (docs/plan/08-qa-report.md).
      - run: python -m pytest --cov --cov-report=term --cov-fail-under=95
      # Every migration can be undone and redone, on real Postgres, in a scratch database.
      - name: Migration rollback on Postgres
        run: |
          PGPASSWORD=rootpulse psql -h localhost -U rootpulse -d rootpulse -c 'CREATE DATABASE rootpulse_scratch'
          DB_NAME=rootpulse_scratch python manage.py check_migrations_reversible

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pip-audit
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-0f5a1c7e9b3d4a6c8e2f1b0a9d8c7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d"
          DJANGO_ALLOWED_HOSTS: api.example.com
          DATABASE_URL: "sqlite:///:memory:"

  container:
    # Builds the real image, starts it in production mode against a real Postgres, and runs the
    # post-deploy smoke test against it: migrations on start, static files, security headers,
    # CORS, the closed and the signed scheduler trigger. What deploys is what was tested.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootpulse
          POSTGRES_USER: rootpulse
          POSTGRES_PASSWORD: rootpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rootpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rootpulse-api .
      - name: Start it in production mode
        run: |
          docker run -d --name api --network host \
            -e DJANGO_DEBUG=false \
            -e DJANGO_SECRET_KEY=ci-0f5a1c7e9b3d4a6c8e2f1b0a9d8c7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_ADMIN_URL=console-ci/ \
            -e DB_NAME=rootpulse -e DB_USER=rootpulse -e DB_PASSWORD=rootpulse \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e CORS_ALLOWED_ORIGINS=https://app.example.com \
            -e FRONTEND_URL=https://app.example.com \
            -e API_PUBLIC_URL=https://api.example.com \
            -e SCHEDULER_SHARED_SECRET=ci-scheduler-secret-ci-scheduler-secret \
            -e PORT=8000 \
            rootpulse-api
      - name: Smoke test the running container
        env:
          SCHEDULER_SHARED_SECRET: ci-scheduler-secret-ci-scheduler-secret
        run: |
          pip install httpx
          python scripts/smoke_test.py --api http://localhost:8000 \
            --cors-origin https://app.example.com --forwarded-https
      - name: The container is not root
        run: test "$(docker exec api id -u)" != "0"
      - name: Show the container's log if anything failed
        if: failure()
        run: docker logs api | tail -80

  prober-tests:
    # The Cloudflare Worker prober shares its SSRF rules and signing format with the API;
    # these tests run against the same fixtures (tests/fixtures) as the Python suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/prober
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test

  live:
    # The checks against real DNS, TLS, HTTP and RDAP, and every provider's real status feed.
    # Nightly and on demand rather than on every push: it needs the internet and is slow.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootpulse
          POSTGRES_USER: rootpulse
          POSTGRES_PASSWORD: rootpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rootpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DB_NAME: rootpulse
      DB_USER: rootpulse
      DB_PASSWORD: rootpulse
      DB_HOST: localhost
      DB_PORT: 5432
      TEST_DATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m pytest -m live tests/live -v
