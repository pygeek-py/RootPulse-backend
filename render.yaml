# Render Blueprint for the RootPulse API. The full walkthrough, in order, is
# docs/plan/09-deployment-runbook.md.
#
# Render's free tier has no always-on Background Worker or Cron Job, so the scheduler is not a
# process here: a GitHub Actions cron (.github/workflows/scheduler.yml) calls the signed
# /internal/run-due-checks/ endpoint every five minutes, which also keeps the free web service
# from spinning down.
#
# `sync: false` means "ask me in the Render dashboard"; the value is never in this file.
# Check the values you entered with: python scripts/preflight.py   (reads your environment, never
# prints a secret).

services:
  - type: web
    name: rootpulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    # Deploys happen when you choose, after CI is green on main, not on every push.
    autoDeployTrigger: checksPass
    envVars:
      # --- Core ---------------------------------------------------------------------------
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true # also signs sign-in tokens: rotating it signs everyone out
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # your API's host(s), comma separated (the *.onrender.com name is allowed automatically, so this can hold just that)
      - key: DJANGO_ADMIN_URL
        sync: false # something unguessable, e.g. console-8f3k2/ (not "admin/")
      - key: DATABASE_URL
        sync: false # the PRODUCTION Neon connection string (a separate project from staging)
      - key: NUM_PROXIES
        value: "2" # the website's proxy (Vercel), then Render's load balancer. Use "1" if the browser calls the API directly
      - key: SIGNUPS_OPEN
        value: "true" # create YOUR account, then change this to "false" (single-owner product)
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false # optional; error tracking on Sentry's free plan. Empty = off
      # --- Where things live ---------------------------------------------------------------
      - key: API_PUBLIC_URL
        sync: false # this API's public https URL, no trailing slash
      - key: FRONTEND_URL
        sync: false # the website's public https URL (OAuth and email links point here)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the website's origin, e.g. https://rootpulse.example.com (no wildcard)
      - key: AUTH_REFRESH_COOKIE_SAMESITE
        value: "Lax" # the website proxies the API, so the cookie is first-party (runbook, "Cookies"). Use "None" only if the browser calls the API directly
      # --- Scheduler and probers -----------------------------------------------------------
      - key: SCHEDULER_SHARED_SECRET
        generateValue: true # copy into the GitHub Actions secret of the same name
      - key: PROBER_SHARED_SECRET
        generateValue: true # copy into each Worker: `wrangler secret put PROBER_SHARED_SECRET`
      - key: PROBER_URLS
        sync: false # name=https://worker-url,name=https://worker-url
      - key: PRIMARY_REGION
        value: render
      # --- Email (sign-in codes, status page subscribers) -----------------------------------
      # Render's free tier blocks outbound SMTP on ports 25, 465 and 587. Brevo (free, 300 a day,
      # sends to anyone once ONE sender address is verified, no domain needed) also listens on 2525.
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_HOST_USER
        sync: false # your Brevo SMTP login (Brevo, SMTP & API, SMTP tab); not necessarily your email
      - key: EMAIL_HOST_PASSWORD
        sync: false # a Brevo SMTP key (the same tab; not your account password)
      - key: DEFAULT_FROM_EMAIL
        sync: false # RootPulse <your-verified-sender@example.com>: the sender address you verified in Brevo
      # --- Sign-in with GitHub --------------------------------------------------------------
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false # the WEBSITE's address: https://<site>/api/v1/auth/github/callback/ (the sign-in cookie must be set on the website)
      # --- Web push -------------------------------------------------------------------------
      - key: VAPID_PRIVATE_KEY
        sync: false # python manage.py generate_vapid_keys (make NEW ones for production)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false # mailto:you@yourdomain.com
      # --- One-click alert channels (each is optional) --------------------------------------
      - key: TELEGRAM_BOT_TOKEN
        sync: false # a bot from @BotFather (the same bot as in development works; see the runbook before sharing one)
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true # then, once: `python manage.py telegram_webhook set` from your machine
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
