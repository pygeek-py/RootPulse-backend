# Render Blueprint — see docs/plan/01-tech-stack.md for the reasoning
# (Render's free tier has no always-on Background Worker/Cron Job, so
# the scheduler is triggered externally by a GitHub Actions cron
# workflow instead, added in Phase 6 once /internal/run-due-checks
# exists — docs/plan/06-roadmap.md).

services:
  - type: web
    name: rootpulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: rootpulse-api.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # set manually to the Neon connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the Vercel frontend URL
      - key: PROBER_SHARED_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false # the Resend API key
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. RootPulse <login@yourdomain.com>, on a domain verified in Resend
      - key: FRONTEND_URL
        sync: false # the Vercel URL, e.g. https://rootpulse.vercel.app
      - key: NUM_PROXIES
        value: "1" # Render's load balancer: keeps per-IP rate limits honest
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false # https://<api-host>/api/v1/auth/github/callback/
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
